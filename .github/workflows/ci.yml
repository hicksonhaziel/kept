name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest -q

      # kept reads its own specification. If it cannot, nothing downstream is
      # trustworthy, so this runs as a gate rather than as a demo.
      - name: Self-parse
        run: uv run kept parse

      # The control fixture is an honest implementation: every promise must reach
      # KEPT. This is what shows kept does not simply cry wolf.
      - name: Verify the control fixture
        run: uv run kept verify --root fixtures/slug --spec ACCEPTANCE.md --gate all-kept

      # The demo fixture publishes real WEAK verdicts. The gate is no-regression,
      # so those are reported rather than suppressed, and a promise that loses
      # ground fails the build.
      - name: Verify the demo fixture
        run: uv run kept verify --root fixtures/refund_engine --gate no-regression

      - name: Brief a weak promise
        run: uv run kept prompt REQ-1.1 --root fixtures/refund_engine

  action:
    name: reusable action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # kept's own action, run on kept's own fixture. If the action cannot verify a
      # project in this repository, it cannot verify anyone else's.
      - name: Run the action against the control fixture
        id: kept
        uses: ./
        with:
          root: fixtures/slug
          spec: ACCEPTANCE.md
          gate: all-kept

      - name: Check the action's outputs
        run: |
          test "${{ steps.kept.outputs.promises }}" = "5"
          test "${{ steps.kept.outputs.kept }}" = "5"
          test "${{ steps.kept.outputs.weak }}" = "0"
          echo "${{ steps.kept.outputs.headline }}"
