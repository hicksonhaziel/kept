name: release

# Publishes to PyPI on a version tag, using trusted publishing: the job proves its
# identity to PyPI with a short-lived OIDC token, so no API token is ever stored in
# this repository. Requires a pending publisher configured on PyPI first — see the
# release checklist in docs/release.md.

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # The only permission trusted publishing needs. Nothing here can write to
      # the repository.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A tag that disagrees with pyproject.toml would publish a version nobody
      # asked for, and a published version can never be replaced.
      - name: Check the tag matches the packaged version
        run: |
          packaged="$(uv run python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "${packaged}" != "${tagged}" ]; then
            echo "tag ${tagged} does not match pyproject version ${packaged}" >&2
            exit 1
          fi
          echo "publishing ${packaged}"

      # The gate before shipping: the tool must still verify itself.
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Test
        run: uv run pytest -q

      - name: Self-verify
        run: uv run kept verify --root . --gate no-regression

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always
